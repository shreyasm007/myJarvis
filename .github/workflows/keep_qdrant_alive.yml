name: Keep Qdrant Alive

on:
  schedule:
    # Run every 5 days - safely within Qdrant's 7-day inactivity window
    - cron: '0 0 */5 * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  ping-qdrant:
    name: Ping Qdrant Cluster
    runs-on: ubuntu-latest

    steps:
      - name: Ping cluster (control plane)
        run: |
          echo "Step 1: Pinging Qdrant cluster..."

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "api-key: ${{ secrets.QDRANT_API_KEY }}" \
            "${{ secrets.QDRANT_URL }}/collections")

          echo "Collections endpoint status: $RESPONSE"

          if [ "$RESPONSE" -ne 200 ]; then
            echo "Cluster not reachable (status $RESPONSE). It may be suspended."
            exit 1
          fi
          echo "Cluster is up."

      - name: Scroll collection (data plane - resets inactivity timer)
        run: |
          echo "Step 2: Performing scroll on portfolio collection..."

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "api-key: ${{ secrets.QDRANT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"limit": 1, "with_payload": false, "with_vector": false}' \
            "${{ secrets.QDRANT_URL }}/collections/portfolio/points/scroll")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "Scroll response status: $HTTP_CODE"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "$BODY" | python3 -c "import sys,json; data=json.load(sys.stdin); pts=data.get('result',{}).get('points',[]); print(f'Retrieved {len(pts)} point(s). Inactivity timer reset.')"
          else
            echo "Scroll failed (status $HTTP_CODE): $BODY"
            exit 1
          fi
