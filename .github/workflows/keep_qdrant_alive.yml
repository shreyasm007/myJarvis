name: Keep Qdrant Alive

on:
  schedule:
    # Run every 5 days - safely within Qdrant's 7-day inactivity window
    - cron: '0 0 */5 * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  ping-qdrant:
    name: Ping Qdrant Cluster
    runs-on: ubuntu-latest

    steps:
      - name: Ping and Heartbeat Upsert (resets inactivity timer)
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import json
          import os
          import sys

          url = os.environ["QDRANT_URL"]
          api_key = os.environ["QDRANT_API_KEY"]

          if not url or not api_key:
              print("Error: QDRANT_URL or QDRANT_API_KEY environment variables are missing.")
              sys.exit(1)

          print("Step 1: Pinging Qdrant control plane...")
          req_ping = urllib.request.Request(
              f"{url}/collections",
              headers={"api-key": api_key}
          )
          try:
              with urllib.request.urlopen(req_ping) as response:
                  print("Ping status:", response.status)
          except Exception as e:
              print("Ping failed:", e)
              sys.exit(1)

          print("\nStep 2: Performing upsert write operation (resets inactivity timer)...")
          # 512-dimension vector matching portfolio collection schema
          dummy_vector = [0.0] * 512
          payload = {
              "points": [
                  {
                      "id": "00000000-0000-0000-0000-000000000000",
                      "vector": dummy_vector,
                      "payload": {"is_keep_alive": True}
                  }
              ]
          }
          req_upsert = urllib.request.Request(
              f"{url}/collections/portfolio/points?wait=true",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "api-key": api_key,
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
              },
              method="PUT"
          )
          try:
              with urllib.request.urlopen(req_upsert) as response:
                  print("Upsert status:", response.status)
                  print("Upsert response:", response.read().decode("utf-8"))
                  print("✅ Inactivity timer reset successfully.")
          except Exception as e:
              print("Upsert failed:", e)
              sys.exit(1)
          EOF
