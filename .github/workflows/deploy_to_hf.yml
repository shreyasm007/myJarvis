name: Deploy to HuggingFace Space

on:
  push:
    branches:
      - main  # Auto-deploy whenever you push to main
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Push to HuggingFace Space
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for proper git push

      - name: Configure Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Push to HuggingFace Space
        run: |
          # Embed HF token into the remote URL for authentication
          git push https://shreyasm007:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/shreyasm007/myJarvis main --force
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
